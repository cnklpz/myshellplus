# Push a tag like v0.2.0 to build, sign and publish a GitHub release.
# The annotated tag message becomes the release notes shown in the in-app update dialog:
#   git tag -a v0.2.0 -m "- ÐÂÔö xxx" && git push origin v0.2.0
# The release carries latest.json, which the in-app updater reads.
# Secrets: TAURI_SIGNING_PRIVATE_KEY (contents of the .key file), TAURI_SIGNING_PRIVATE_KEY_PASSWORD (may be empty).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release notes from tag message
        shell: bash
        run: |
          git fetch --force --tags
          {
            echo 'NOTES<<__EOF__'
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo '__EOF__'
          } >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          tagName: ${{ github.ref_name }}
          releaseName: MyShell+ ${{ github.ref_name }}
          releaseBody: ${{ env.NOTES }}
          releaseDraft: false
          includeUpdaterJson: true
